[package]
name = "lindrop-transfer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
strip = "symbols"
debug = 0

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
md-5 = "0.10"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "fs", "io-util"] }
tokio-native-tls = "0.3"
